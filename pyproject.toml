# Tool configuration only. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs/okf/.tools", "scripts/phases_status.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
